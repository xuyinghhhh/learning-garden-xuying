<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc"><title id="title">个人学习网站完整链路</title><desc id="desc">先通过 Cloudflare 与 GitHub 登录编辑器，再写笔记、保存到仓库，由 Actions 构建并交给 Pages 公开展示。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8ca4bb"/></marker></defs><rect width="1200" height="1460" fill="#f7faff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="56" y="68" font-size="36" fill="#153858" font-weight="700">从一篇笔记，到一个公开链接</text><text x="56" y="105" font-size="19" fill="#61768c" font-weight="400">你的个人学习网站 · 平台分工与每日使用路线</text><rect x="56" y="132" width="1088" height="54" rx="14" fill="#e9f2fc" stroke="#dce5ef"/><text x="78" y="166" font-size="19" fill="#20334b" font-weight="400">蓝色：你在浏览器操作     青绿色：平台自动完成     灰色：只在配置或排错时查看</text><text x="56" y="233" font-size="25" fill="#153858" font-weight="700">A  登录验证：首次登录或登录失效时</text><rect x="56" y="259" width="254" height="96" rx="14" fill="white" stroke="#dce5ef"/><text x="74" y="295" font-size="21" fill="#20334b" font-weight="700">打开编辑器</text><text x="74" y="326" font-size="16" fill="#61768c" font-weight="400">Decap CMS · /admin/</text><path d="M312,307 L331,307" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="334" y="259" width="254" height="96" rx="14" fill="white" stroke="#dce5ef"/><text x="352" y="295" font-size="21" fill="#20334b" font-weight="700">启动登录服务</text><text x="352" y="326" font-size="16" fill="#61768c" font-weight="400">Cloudflare Worker</text><path d="M590,307 L609,307" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="612" y="259" width="254" height="96" rx="14" fill="white" stroke="#dce5ef"/><text x="630" y="295" font-size="21" fill="#20334b" font-weight="700">确认身份与授权</text><text x="630" y="326" font-size="16" fill="#61768c" font-weight="400">GitHub OAuth</text><path d="M868,307 L887,307" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="890" y="259" width="254" height="96" rx="14" fill="white" stroke="#dce5ef"/><text x="908" y="295" font-size="21" fill="#20334b" font-weight="700">返回笔记管理</text><text x="908" y="326" font-size="16" fill="#61768c" font-weight="400">Decap CMS</text><text x="56" y="389" font-size="19" fill="#61768c" font-weight="400">Cloudflare 完成登录衔接；笔记保存在 GitHub，公开页面由 GitHub Pages 提供。</text><text x="56" y="451" font-size="25" fill="#153858" font-weight="700">B  日常发布：你写好，后续自动同步</text><text x="80" y="494" font-size="17" fill="#61768c" font-weight="700">操作 / 自动处理</text><text x="454" y="494" font-size="17" fill="#61768c" font-weight="700">在哪个软件或平台</text><text x="830" y="494" font-size="17" fill="#61768c" font-weight="700">完成后的结果</text><rect x="56" y="518" width="1088" height="108" rx="14" fill="#f0f6ff" stroke="#dce5ef"/><circle cx="91" cy="552" r="20" fill="#2568ad"/><text x="78" y="559" font-size="17" fill="white" font-weight="700">01</text><text x="126" y="557" font-size="21" fill="#2568ad" font-weight="700">新建或修改笔记</text><text x="126" y="593" font-size="16" fill="#61768c" font-weight="400">填标题、日期、主题、正文</text><text x="454" y="557" font-size="21" fill="#20334b" font-weight="700">浏览器中的 Decap CMS</text><text x="454" y="593" font-size="16" fill="#61768c" font-weight="400">网站地址后加 /admin/</text><text x="830" y="557" font-size="20" fill="#20334b" font-weight="700">内容仍在编辑中</text><text x="830" y="593" font-size="16" fill="#61768c" font-weight="400">此时还没有公开</text><path d="M600,629 L600,647" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="651" width="1088" height="108" rx="14" fill="#f0f6ff" stroke="#dce5ef"/><circle cx="91" cy="685" r="20" fill="#2568ad"/><text x="78" y="692" font-size="17" fill="white" font-weight="700">02</text><text x="126" y="690" font-size="21" fill="#2568ad" font-weight="700">关闭草稿 → 发布</text><text x="126" y="726" font-size="16" fill="#61768c" font-weight="400">检查内容后点击发布</text><text x="454" y="690" font-size="21" fill="#20334b" font-weight="700">Decap CMS → GitHub</text><text x="454" y="726" font-size="16" fill="#61768c" font-weight="400">提交到 main 分支</text><text x="830" y="690" font-size="20" fill="#20334b" font-weight="700">Markdown 与图片保存</text><text x="830" y="726" font-size="16" fill="#61768c" font-weight="400">仓库留下修改记录</text><path d="M600,762 L600,780" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="784" width="1088" height="108" rx="14" fill="#eaf7f4" stroke="#dce5ef"/><circle cx="91" cy="818" r="20" fill="#167a76"/><text x="78" y="825" font-size="17" fill="white" font-weight="700">03</text><text x="126" y="823" font-size="21" fill="#167a76" font-weight="700">自动测试与构建</text><text x="126" y="859" font-size="16" fill="#61768c" font-weight="400">检查内容格式，生成网站</text><text x="454" y="823" font-size="21" fill="#20334b" font-weight="700">GitHub Actions</text><text x="454" y="859" font-size="16" fill="#61768c" font-weight="400">自动执行 tests / build</text><text x="830" y="823" font-size="20" fill="#20334b" font-weight="700">生成网站成品</text><text x="830" y="859" font-size="16" fill="#61768c" font-weight="400">包括新的 notes.json</text><path d="M600,895 L600,913" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="917" width="1088" height="108" rx="14" fill="#eaf7f4" stroke="#dce5ef"/><circle cx="91" cy="951" r="20" fill="#167a76"/><text x="78" y="958" font-size="17" fill="white" font-weight="700">04</text><text x="126" y="956" font-size="21" fill="#167a76" font-weight="700">自动部署网站</text><text x="126" y="992" font-size="16" fill="#61768c" font-weight="400">将成品发布到公开站点</text><text x="454" y="956" font-size="21" fill="#20334b" font-weight="700">GitHub Pages</text><text x="454" y="992" font-size="16" fill="#61768c" font-weight="400">由工作流完成部署</text><text x="830" y="956" font-size="20" fill="#20334b" font-weight="700">新内容可公开访问</text><text x="830" y="992" font-size="16" fill="#61768c" font-weight="400">部署成功才算同步完成</text><path d="M600,1028 L600,1046" fill="none" stroke="#8ca4bb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="1050" width="1088" height="108" rx="14" fill="#f0f6ff" stroke="#dce5ef"/><circle cx="91" cy="1084" r="20" fill="#2568ad"/><text x="78" y="1091" font-size="17" fill="white" font-weight="700">05</text><text x="126" y="1089" font-size="21" fill="#2568ad" font-weight="700">打开主页检查并分享</text><text x="126" y="1125" font-size="16" fill="#61768c" font-weight="400">搜索标题，点击文章阅读</text><text x="454" y="1089" font-size="21" fill="#20334b" font-weight="700">浏览器中的公开主页</text><text x="454" y="1125" font-size="16" fill="#61768c" font-weight="400">你和访客都使用这个入口</text><text x="830" y="1089" font-size="20" fill="#20334b" font-weight="700">阅读笔记、图片与表格</text><text x="830" y="1125" font-size="16" fill="#61768c" font-weight="400">访客无需登录 GitHub</text><rect x="56" y="1200" width="1088" height="88" rx="14" fill="#fff6e5" stroke="#efd7a6"/><text x="78" y="1233" font-size="20" fill="#805b16" font-weight="700">如果第 03 或 04 步失败：新笔记已保存，但公开网站仍可能显示旧内容。</text><text x="78" y="1265" font-size="18" fill="#805b16" font-weight="400">去 GitHub → Actions 看最新运行；确认成功后，再刷新公开主页。</text><text x="56" y="1344" font-size="24" fill="#153858" font-weight="700">平时只记住两个入口</text><text x="56" y="1382" font-size="20" fill="#20334b" font-weight="400">写笔记：网站 /admin/     看成果：网站首页     配置完成后，无须每天打开 Cloudflare。</text><text x="56" y="1425" font-size="17" fill="#61768c" font-weight="400">完整可点击链接、填写示例与检查步骤，见下方操作指南。</text></g></svg>